<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Piddi 🎉</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Poppins', sans-serif;
}

body{
  height:100vh;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow:hidden;
}

.confetti{
  position:fixed;
  width:8px;
  height:14px;
  background:red;
  top:-20px;
  animation:fall 5s linear infinite;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}

.container{
  position:relative;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.photo{
  width:220px;
  height:220px;
  border-radius:20px;
  background:url("photo.jpg") center/cover;
  box-shadow:0 20px 40px rgba(0,0,0,0.3);
  animation:pop 1.5s ease;
}

@keyframes pop{
  from{transform:scale(0);}
  to{transform:scale(1);}
}

h1{
  margin-top:20px;
  font-size:2.2rem;
  color:#fff;
}

.cake{
  margin:20px 0;
}

.candle{
  width:10px;
  height:30px;
  background:white;
  margin:0 auto;
  position:relative;
}

.flame{
  width:12px;
  height:12px;
  background:orange;
  border-radius:50%;
  position:absolute;
  top:-10px;
  left:-1px;
  animation:flicker 0.8s infinite;
}

@keyframes flicker{
  0%{transform:scale(1);}
  50%{transform:scale(0.7);}
  100%{transform:scale(1);}
}

.cake-body{
  width:120px;
  height:60px;
  background:#ff6f91;
  border-radius:10px;
  margin:0 auto;
}

p{
  color:white;
  margin-top:15px;
  font-size:1.05rem;
  line-height:1.6;
}

.date{
  margin-top:10px;
  font-size:1.1rem;
}
</style>
</head>

<body>

<div class="container">

  <div class="photo"></div>

  <h1>Happy Birthday Piddi 🎂💕</h1>

  <div class="cake">
    <div class="candle">
      <div class="flame"></div>
    </div>
    <div class="cake-body"></div>
  </div>

  <p>
    Tum meri zindagi ka sabse pyara hissa ho 🥹❤️<br>
    Tumhari smile meri duniya roshan kar deti hai.<br>
    Aaj ka din sirf tumhara hai baby 💖
  </p>

  <div class="date">🎉 28 / 12 / 2009</div>

</div>

<script>
for(let i=0;i<40;i++){
  let c=document.createElement("div");
  c.className="confetti";
  c.style.left=Math.random()*100+"vw";
  c.style.backgroundColor=`hsl(${Math.random()*360},100%,60%)`;
  c.style.animationDuration=3+Math.random()*3+"s";
  document.body.appendChild(c);
}
</script>

</body>
</html>
